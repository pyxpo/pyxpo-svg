[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo-svg"
dynamic = ["version"]
description = "SVG shapes, paths and text for pyxpo apps: charts, rings, sparklines and icons drawn natively."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["pyxpo", "pyxpo-module", "mobile", "android", "ios", "svg", "vector", "path", "chart", "icons", "graphics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Android",
    "Operating System :: iOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = ["pyxpo>=0.1.0a3,<0.2"]

[project.urls]
Homepage = "https://github.com/pyxpo/pyxpo-svg"
Documentation = "https://github.com/pyxpo/pyxpo-svg/blob/main/README.md"
Changelog = "https://github.com/pyxpo/pyxpo-svg/blob/main/CHANGELOG.md"
Source = "https://github.com/pyxpo/pyxpo-svg"
Issues = "https://github.com/pyxpo/pyxpo-svg/issues"

# How `pyxpo build` finds this module: the entry point name is the module name apps list in
# `[tool.pyxpo] modules`, its value the import package holding pyxpo-module.json.
[project.entry-points."pyxpo.modules"]
svg = "pyxpo_svg"

[tool.setuptools]
packages = ["pyxpo_svg"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo_svg.__version__" }

[tool.setuptools.package-data]
pyxpo_svg = ["pyxpo-module.json", "py.typed", "ios/**/*", "android/**/*", "web.js"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", ".DS_Store"]
